<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CricketLive — Live Cricket Scores & Sports News</title>

<meta name="description"
content="Live cricket scores, match updates, fixtures, results, cricket news, points tables and sports updates.">

<style>
:root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #172033;
    --muted: #687386;
    --primary: #0b7a45;
    --primary-dark: #075b34;
    --border: #e2e7ef;
    --danger: #d62828;
    --gold: #f4b400;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
}

a {
    color: inherit;
    text-decoration: none;
}

.container {
    width: min(1200px, 94%);
    margin: auto;
}

/* HEADER */

header {
    background: var(--primary);
    color: white;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 3px 12px rgba(0,0,0,.12);
}

.topbar {
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    white-space: nowrap;
}

.logo span {
    color: #ffd447;
}

nav {
    display: flex;
    gap: 20px;
    align-items: center;
}

nav a {
    font-size: 14px;
    font-weight: 600;
}

nav a:hover {
    color: #ffd447;
}

.menu-btn {
    display: none;
    border: 0;
    background: transparent;
    color: white;
    font-size: 26px;
    cursor: pointer;
}

/* TICKER */

.ticker {
    background: #111827;
    color: white;
    overflow: hidden;
}

.ticker-inner {
    display: flex;
    align-items: center;
    min-height: 38px;
    gap: 15px;
}

.ticker-label {
    background: var(--danger);
    padding: 5px 10px;
    font-size: 12px;
    font-weight: bold;
}

.ticker-text {
    white-space: nowrap;
    animation: ticker 25s linear infinite;
}

@keyframes ticker {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
}

/* HERO */

.hero {
    padding: 35px 0 20px;
}

.hero-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
}

.hero-main {
    min-height: 300px;
    border-radius: 18px;
    padding: 35px;
    color: white;
    display: flex;
    align-items: end;
    background:
        linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.8)),
        linear-gradient(135deg, #086f3d, #111827);
}

.hero-main h1 {
    font-size: clamp(30px, 5vw, 50px);
    margin-bottom: 10px;
}

.hero-main p {
    color: #e5e7eb;
}

.hero-side {
    display: grid;
    gap: 15px;
}

.mini-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 20px;
}

.mini-card small {
    color: var(--muted);
}

.mini-card h3 {
    margin-top: 5px;
}

/* SECTION */

.section {
    padding: 20px 0;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.section-title h2 {
    font-size: 24px;
}

.section-title a {
    color: var(--primary);
    font-size: 14px;
    font-weight: bold;
}

/* SCORE CARDS */

.score-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
}

.score-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,.04);
}

.live {
    color: var(--danger);
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 12px;
}

.live::before {
    content: "●";
    margin-right: 5px;
}

.match-title {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 12px;
}

.team {
    display: flex;
    justify-content: space-between;
    margin: 8px 0;
    font-weight: bold;
}

.score {
    font-size: 18px;
}
